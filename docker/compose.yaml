# forgejo-mcp — MCP bridge for Forgejo, exposing CTI repo/issue ops to AI assistants
# Dockge stack: forgejo-mcp
# SSE endpoint: http://<host>:8089/sse

services:
  forgejo-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forgejo-mcp
    restart: unless-stopped
    environment:
      - FORGEJO_URL=${FORGEJO_URL}
      - FORGEJO_ACCESS_TOKEN=${FORGEJO_ACCESS_TOKEN}
      - FORGEJO_DEBUG=${FORGEJO_DEBUG:-false}
    ports:
      - "${FORGEJO_MCP_PORT:-8089}:8080"
    healthcheck:
      test: ["CMD", "curl", "-s", "-I", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cti-net

networks:
  cti-net:
    external: true
